name: Pylint

on:
  push:
    branches:
      - dev
    paths:
      - 'sweepseries/**'
  pull_request:
    branches:
      - dev
    paths:
      - 'sweepseries/**'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      NAVER_API_KEY_ID: "NAVER_API_KEY_ID"
      NAVER_API_KEY: "NAVER_API_KEY"
      AWS_ACCESS_KEY: "AWS_ACCESS_KEY"
      AWS_SECRET_KEY: "AWS_SECRET_KEY"
      SMS_API_KEY: "SMS_API_KEY"
      DJANGO_SETTINGS_MODULE: "sweepseries.settings.local"
    strategy:
      matrix:
        python-version: ["3.9"]
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pipenv
        sudo apt-get install graphviz graphviz-dev
        cd sweepseries
        pipenv install --dev

    - name: Analysing the code with pylint
      run: |
        cd sweepseries
        pipenv run DJANGO_SETTINGS_MODULE=sweepseries.settings.local pylint --load-plugins pylint_django --rcfile=.pylintrc .
