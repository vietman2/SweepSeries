name: Coverage

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      NAVER_API_KEY_ID: "NAVER_API_KEY_ID"
      NAVER_API_KEY: "NAVER_API_KEY"
      AWS_ACCESS_KEY: "AWS_ACCESS_KEY"
      AWS_SECRET_KEY: "AWS_SECRET_KEY"
      SMS_API_KEY: "SMS_API_KEY"
      KAKAO_APP_KEY: "KAKAO_APP_KEY"
      NAVER_CONSUMER_KEY: "NAVER_CONSUMER_KEY"
      NAVER_CONSUMER_SECRET: "NAVER_CONSUMER_SECRET"
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.9]
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pipenv'

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: "./sweep/yarn.lock"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update
          sudo apt-get install -y lcov
          pip install pipenv
          cd sweepseries
          pipenv install --dev
          cd ../sweep
          yarn install
          cd ../catchb-admin
          yarn install
          cd ../catchbweb
          yarn install
          cd ..

      - name: Backend Coverage
        run: |
          cd sweepseries
          pipenv run coverage run manage.py test
          pipenv run coverage lcov
          pipenv run coverage xml
          sed -i "s|<source></source>|<source>sweepseries</source>|g" coverage.xml
          cd ..

      - name: Catch B Mobile App Coverage
        run: |
          cd sweep
          yarn global add lcov-result-merger
          yarn test --coverage --watchAll=false
          cp coverage/lcov.info coverage.lcov
          cd ..
          lcov-result-merger '*/coverage.lcov' coverage.lcov --prepend-source-files --prepend-path-fix "."

      - name: Catch B Admin Web Coverage
        run: |
          cd catchb-admin
          yarn global add lcov-result-merger
          yarn test --coverage --watchAll=false
          cp coverage/lcov.info coverage.lcov
          cd ..
          lcov-result-merger '*/coverage.lcov' coverage.lcov --prepend-source-files --prepend-path-fix "."

      - name: Catch B Web Coverage
        run: |
          cd catchbweb
          yarn global add lcov-result-merger
          yarn test --coverage --watchAll=false
          cp coverage/lcov.info coverage.lcov
          cd ..
          lcov-result-merger '*/coverage.lcov' coverage.lcov --prepend-source-files --prepend-path-fix "."

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload Coverage to Coveralls
        uses: coverallsapp/github-action@v2.2.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./coverage.lcov
